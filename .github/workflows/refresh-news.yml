name: Update news and publish website

on:
  push:
    branches: [main]
  schedule:
    # UTC :17 / :47 are also Taipei :17 / :47. Avoid busy hour boundaries.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect current RSS and news search results
        id: collect
        continue-on-error: true
        run: node scripts/collect-news.mjs
      - name: Save snapshot and source status
        # Preserve failure status and dated fallback articles even when all feeds fail.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f public/data/news.json ]; then exit 0; fi
          git add -- public/data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh travel news snapshot'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test collector
        run: npm test
      - name: Build static website
        run: npm run build:pages
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - name: Report source outage
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::Sources unavailable. Publishing retained data with failure status.'

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
